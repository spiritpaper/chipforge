[project]
name = "chipforge-api"
version = "0.1.0"
description = "ChipForge server: accounts, song and sound sync, share links"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
dependencies = [
    "fastapi>=0.115",
    "sqlalchemy>=2",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = ["pytest>=8", "httpx2", "ruff>=0.6"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["."]
