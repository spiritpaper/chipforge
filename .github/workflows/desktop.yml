name: Desktop

# Desktop builds take a while, so they run when the desktop app changes, for
# version tags, and on demand (Actions → Desktop → Run workflow).
#
# Releases are automatic: when main has an app version (desktop/src-tauri/tauri.conf.json)
# with no release yet, the installers are published as release v<version>, which also
# creates the tag. Pushing a tag by hand does the same; a tag with a suffix, such as
# v0.2.0-rc.1 while the app version is 0.2.0, makes a pre-release for trying things out.
on:
  workflow_dispatch:
  push:
    branches: ["**"]
    # Path filters don't apply to tag pushes, so every version tag builds.
    tags: ["v*"]
    paths: ["desktop/**", ".github/workflows/desktop.yml"]
  pull_request:
    paths: ["desktop/**", ".github/workflows/desktop.yml"]

jobs:
  # Decides whether this run publishes a release, and under which tag.
  plan:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      release: ${{ steps.plan.outputs.release }}
    steps:
      - uses: actions/checkout@v7
      - id: plan
        run: |
          version=$(node -p "require('./desktop/src-tauri/tauri.conf.json').version")
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag=$GITHUB_REF_NAME
            tag_version=${tag#v}
            if [ "${tag_version%%-*}" != "$version" ]; then
              echo "::error::tag $tag doesn't match the app version $version (desktop/src-tauri/tauri.conf.json)"
              exit 1
            fi
            release=true
          elif [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ] \
              && [ -z "$(git ls-remote --tags origin "refs/tags/v$version")" ]; then
            tag=v$version
            release=true
          else
            tag=v$version
            release=false
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "Version $version, tag $tag, release: $release"

  build:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install WebKitGTK and friends
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Builds the web app (and its WASM chip core), then the installers.
      - run: pnpm --filter chipforge-desktop build
      - uses: actions/upload-artifact@v7
        with:
          name: chipforge-desktop-${{ matrix.name }}
          path: |
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/rpm/*.rpm
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  release:
    if: needs.plan.outputs.release == 'true'
    needs: [plan, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: installers
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          prerelease=$([[ "$TAG" == *-* ]] && echo --prerelease || true)
          # Creates the tag on this commit if it doesn't exist yet.
          gh release create "$TAG" installers/* \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "ChipForge $TAG" \
            --generate-notes $prerelease
