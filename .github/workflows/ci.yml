name: CI

on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # libvgm's vgm2wav: an independent NES APU emulator to check VGM export against.
      - name: Build vgm2wav
        run: |
          git clone --depth 1 https://github.com/ValleyBell/libvgm ~/libvgm
          cmake -S ~/libvgm -B ~/libvgm/build -DCMAKE_BUILD_TYPE=Release -DBUILD_PLAYER=OFF -DBUILD_VGM2WAV=ON -DBUILD_LIBAUDIO=OFF -DBUILD_TESTS=OFF
          cmake --build ~/libvgm/build -j4
          echo "VGM2WAV=$HOME/libvgm/build/bin/vgm2wav" >> "$GITHUB_ENV"
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --profile wasm --target wasm32-unknown-unknown -p chipcore
      # The C header against the shared library, compiled and run from C.
      - run: native/tests/c/run.sh

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web wasm
      - run: pnpm --filter web check
      - run: pnpm --filter web test
      - run: pnpm --filter web build

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web build
      # GitHub's Ubuntu runners include Google Chrome.
      - run: pnpm --filter web e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: web/e2e/.tmp/*.png

  godot:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.7.2
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}
      - name: Download Godot
        run: |
          if [ ! -x ~/godot/godot ]; then
            mkdir -p ~/godot && cd ~/godot
            zip=Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
            curl -sSLO https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/$zip
            curl -sSL https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/SHA512-SUMS.txt | grep " $zip$" | sha512sum -c -
            unzip -q $zip && mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot && rm $zip
          fi
      - run: GODOT=~/godot/godot engines/godot/test.sh

  unity-wrapper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      # The C# wrapper against the native library; the Unity-only parts need Unity.
      - run: engines/unity/test.sh
