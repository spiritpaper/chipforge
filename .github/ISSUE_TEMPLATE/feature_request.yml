name: Idea or feature request
description: Suggest something ChipForge could do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem or goal, before any particular solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
