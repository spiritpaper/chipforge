name: Bug report
description: Something doesn't work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Where?
      options: [SFX Lab, Compose, Convert, Export, Godot plugin, Unity package, C library, Other]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Attach a .chipsong, .chipsong.json or share link if it helps.
  - type: input
    id: env
    attributes:
      label: Browser / engine and OS
      placeholder: Firefox 131 on Windows 11, Godot 4.4 on macOS, …
